name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  modern-fabric:
    name: Build modern Fabric client
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build mod
        run: bash ./gradlew --no-daemon build
      - name: Upload mod JAR
        uses: actions/upload-artifact@v7
        with:
          name: clientpulse-26.3-fabric-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

  legacy-forge:
    name: Build legacy Forge client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: versions/1.7.10-forge
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Java 8
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "8"
      - name: Build mod
        run: bash ./gradlew --no-daemon build
