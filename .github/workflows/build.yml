name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ClientPulse
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.7.0"
      - name: Build mod
        run: gradle --no-daemon build
      - name: Upload mod JAR
        uses: actions/upload-artifact@v7
        with:
          name: clientpulse-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
